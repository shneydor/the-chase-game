# מפרסם את המשחק ל-GitHub Pages — וגם מדליק את Pages בעצמו בפעם הראשונה,
# כך שאין צורך להיכנס להגדרות הריפו.
name: Pages

on:
  push:
    branches: [claude/the-chase-trivia-game-xzfg2i]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true          # יוצר את אתר ה-Pages אם עוד אין כזה
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .                   # index.html יושב בשורש
      - id: deployment
        uses: actions/deploy-pages@v4
